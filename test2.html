<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Image with Shadows and Borders</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        .image-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        
        .circular-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            box-shadow: 
                0 0 10px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(0, 0, 0, 0.2),
                0 0 30px rgba(0, 0, 0, 0.1);
        }
        
        .border-line {
            position: absolute;
            background-color: white;
            z-index: 1;
        }
        
        .top-line, .bottom-line {
            width: calc(100% + 40px);
            height: 2px;
            left: -20px;
        }
        
        .top-line {
            top: -20px;
        }
        
        .bottom-line {
            bottom: -20px;
        }
        
        .left-line, .right-line {
            width: 2px;
            height: calc(100% + 40px);
            top: -20px;
        }
        
        .left-line {
            left: -20px;
        }
        
        .right-line {
            right: -20px;
        }
        
        .shadow-circle {
            position: absolute;
            border-radius: 50%;
            z-index: 1;
        }
        
        .shadow-1 {
            width: 110%;
            height: 110%;
            top: -5%;
            left: -5%;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 70%);
        }
        
        .shadow-2 {
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0) 80%);
        }
        
        .shadow-3 {
            width: 130%;
            height: 130%;
            top: -15%;
            left: -15%;
            background: radial-gradient(circle, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0) 90%);
        }
    </style>
</head>
<body>
    <div class="image-container">
        <!-- Shadow circles -->
        <div class="shadow-circle shadow-3"></div>
        <div class="shadow-circle shadow-2"></div>
        <div class="shadow-circle shadow-1"></div>
        
        <!-- Border lines -->
        <div class="border-line top-line"></div>
        <div class="border-line bottom-line"></div>
        <div class="border-line left-line"></div>
        <div class="border-line right-line"></div>
        
        <!-- Main image -->
        <img src="assets/images/hero/user.png" alt="Circular Image" class="circular-image">
    </div>

    <script>
        // JavaScript to dynamically load an image if needed
        document.addEventListener('DOMContentLoaded', function() {
            // You can replace this with your actual image source
            const image = document.querySelector('.circular-image');
            // image.src = 'your-image-path.jpg';
            
            // Additional interactive effects can be added here
            image.addEventListener('mouseover', function() {
                this.style.transform = 'scale(1.02)';
                this.style.transition = 'transform 0.3s ease';
            });
            
            image.addEventListener('mouseout', function() {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
