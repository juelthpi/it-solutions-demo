<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enhanced Glowing Circular Animation</title>
  <style>
    body {
      background-color: #060e2d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .circle-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
    }

    .circle-image {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      z-index: 2;
      box-shadow:
        0 0 30px rgba(0, 255, 255, 0.4),
        0 0 60px rgba(0, 255, 255, 0.2),
        0 0 90px rgba(0, 255, 255, 0.1),
        0 0 120px rgba(0, 255, 255, 0.05);
    }

    .circle-border {
      position: absolute;
      top: -15px;
      left: -15px;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
    }

    .arc {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      animation: rotate 4s linear infinite;
    }

    .arc::before,
    .arc::after {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    .arc::before {
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .arc::after {
      bottom: 0;
      right: 50%;
      transform: translateX(50%);
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="circle-wrapper">
    <div class="circle-border">
      <div class="arc"></div>
    </div>
    <img src="assets/images/hero/user.png" class="circle-image" alt="Person">
  </div>

</body>
</html>
